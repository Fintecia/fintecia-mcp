name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # softprops/action-gh-release creates the GitHub Release.
  id-token: write # npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for the tag-on-main ancestry check below.

      # Guard against the 2026-11-11 incident: v1.0.0 was tagged on a commit
      # (e140f4a) that lived on a feature branch later deleted, so npm published
      # with provenance pointing to an orphan commit ("does not belong to any
      # branch"). The tag MUST be cut from main, or the publish is aborted.
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: tag commit $GITHUB_SHA is on main"
          else
            echo "FAIL: tag commit $GITHUB_SHA is NOT on main — release tags must be cut from main"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # v7 no longer injects a dummy NODE_AUTH_TOKEN; Node 24 ships npm >= 11
          # (native OIDC Trusted Publishing). No `registry-url`: it writes an
          # `_authToken` shim into .npmrc that makes npm skip OIDC.

      # Version-parity gate: the tag must equal v<package.json version>. Fails
      # the release before any publish if the tag drifts from the declared version.
      - name: Validate version parity
        run: node scripts/check-version.mjs
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Trusted Publishing (OIDC): npm exchanges the GitHub OIDC token for a
      # short-lived publish token. Token-free — no NPM_TOKEN, no .npmrc, no
      # NODE_AUTH_TOKEN. Manual one-time setup in npm: package `fintecia` →
      # Settings → Trusted publishers → Add trusted publisher → GitHub Actions,
      # Owner `Fintecia`, Repository `fintecia-mcp`,
      # Workflow `.github/workflows/release.yml`.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
